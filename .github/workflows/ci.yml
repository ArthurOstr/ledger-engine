name: Backend Architecture CI 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs: 
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >- 
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt
      - name: Execute Pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: temporary_ci_secret_key_do_not_use_in_prod
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60

          GOOGLE_CLIENT_ID: dummy_ci_client_id
          GOOGLE_CLIENT_SECRET: dummy_ci_client_secret
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_SUCCESS_URI: http://localhost:5173/
        run: |
          python -m pytest app/tests/
